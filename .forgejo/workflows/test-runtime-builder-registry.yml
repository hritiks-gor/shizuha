name: test-runtime-builder-registry
on:
  workflow_dispatch: {}
concurrency:
  group: test-runtime-builder-registry
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: deploy-lane
    # Container jobs default to sh; keep bash explicit for the pipefail caller.
    defaults:
      run:
        shell: bash
    container:
      image: registry.registry.svc.cluster.local:5000/origin-ci-helm@sha256:90f02d48d68c0ed690f9ddd8bcef1167490610362c19d429943931433ed7b194
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Qualify isolated builder registry traffic
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          job="ci-runtime-registry-${GITHUB_RUN_ID}"
          cleanup() { kubectl delete job -n build "$job" --ignore-not-found --wait=false >/dev/null; }
          trap cleanup EXIT
          python3 scripts/render-runtime-registry-canary.py "$GITHUB_RUN_ID" > /tmp/registry-canary.json
          kubectl create -f /tmp/registry-canary.json
          result=0
          python3 scripts/wait-k8s-job-terminal.py --namespace build --job "$job" --timeout-seconds 240 || result=$?
          kubectl logs -n build "job/$job"
          exit "$result"
